
name: Client Support Portal CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  laravel-tests:
    name: Laravel Tests
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, dom, fileinfo, pdo_sqlite, sqlite3, pdo_mysql
          coverage: none
          tools: composer:v2

      - name: Validate Composer
        run: composer validate --no-check-publish

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Generate test application key
        run: echo "APP_KEY=$(php artisan key:generate --show)" >> "$GITHUB_ENV"

      - name: Run Laravel tests
        run: php artisan test

  vue-build:
    name: Vue TypeScript Build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install frontend dependencies
        run: npm ci

      - name: Check TypeScript
        run: npm run typecheck

      - name: Build frontend
        run: npm run build
